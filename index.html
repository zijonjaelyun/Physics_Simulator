<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>물리 실험실 | 인터랙티브 시뮬레이션</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#e9f0ff;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #27334d;background:#111a30}h1{margin:0;font-size:25px}header p{color:#9eacc7;margin:6px 0 0}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 90px)}nav{padding:18px;background:#10182a;border-right:1px solid #26334b}nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:13px 12px;border:0;border-radius:10px;color:#bac9e3;background:transparent;cursor:pointer;font-size:14px}nav button.active,nav button:hover{background:#24416d;color:white}main{padding:22px;max-width:1450px;width:100%;margin:auto}.grid{display:grid;grid-template-columns:minmax(300px,1.65fr) minmax(260px,1fr);gap:16px}.card{background:#151f34;border:1px solid #293852;border-radius:16px;padding:18px;margin-bottom:16px}h2{margin:0 0 8px;font-size:22px}h3{margin:0 0 15px;font-size:16px}p,small{color:#aebed8;line-height:1.6}canvas{display:block;width:100%;background:#0b1426;border-radius:12px}#scene{height:350px}#graph{height:205px}.field{margin:13px 0}.field label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#c6d3eb}.field input{width:100%;accent-color:#65c4ff;margin-top:8px}.value{color:#70d5ff;font-variant-numeric:tabular-nums}.buttons{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.buttons button,select{border:1px solid #3a5476;background:#213653;color:white;border-radius:9px;padding:9px 13px;cursor:pointer}button.primary{background:#166fbe;border-color:#328fe0}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stat{background:#101b2f;padding:12px;border-radius:10px;min-width:0}.stat span{font-size:11px;color:#9aafce;display:block}.stat strong{font-size:17px;color:#f3f8ff;overflow-wrap:anywhere}.formula{font-family:ui-monospace,Consolas,monospace;background:#0e192c;padding:12px;border-radius:9px;color:#a9e6ff;white-space:pre-wrap;line-height:1.8;font-size:13px}.tag{display:inline-block;background:#293d5d;color:#b8d7ff;padding:5px 9px;border-radius:30px;font-size:11px;margin-bottom:8px}.notice{border-left:3px solid #e5ad5d;padding:9px 12px;background:#30291f;font-size:12px;color:#eed6b4}#time{width:100%;accent-color:#65c4ff}.muted{font-size:12px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#modeWrap{margin-bottom:12px}@media(max-width:850px){.shell{display:block}nav{display:flex;overflow:auto;gap:6px;padding:10px}nav button{white-space:nowrap;width:auto;flex-shrink:0}.grid{grid-template-columns:1fr}main{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>⚛ 물리 실험실</h1><p>수학 × 물리 × 정보 | 공식 기반 인터랙티브 시뮬레이션</p></header><div class="shell"><nav id="nav"></nav><main><div class="card"><span class="tag" id="category">운동</span><h2 id="title"></h2><p id="intro"></p></div><div class="grid"><section><div class="card"><h3>실시간 시뮬레이션</h3><canvas id="scene"></canvas><div class="buttons"><button id="play" class="primary">▶ 재생</button><button id="reset">↺ 초기화</button><label class="muted">재생 속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label></div><label class="muted" for="time">시뮬레이션 시간: <strong id="clock">0.00 s</strong></label><input type="range" id="time" min="0" max="10" step="0.001" value="0"></div><div class="card"><h3 id="graphTitle">시간에 따른 물리량</h3><canvas id="graph"></canvas><p class="muted">그래프의 점선은 현재 시각을 나타냅니다.</p></div></section><aside><div class="card"><h3>실험 조건</h3><div id="modeWrap"></div><div id="fields"></div></div><div class="card"><h3>실시간 측정값</h3><div class="stats" id="stats"></div></div><div class="card"><h3>적용 공식과 물리적 조건</h3><div id="formula" class="formula"></div><p id="assumptions" class="muted"></p><div class="notice" id="warning"></div></div></aside></div></main></div><script>
'use strict';
const G=6.67430e-11,C=299792458,g0=9.81,TAU=Math.PI*2;
const modules=[
{id:'linear',name:'등가속도 직선 운동',intro:'초기 속도와 일정한 가속도로 위치·속도의 시간 변화를 관찰합니다.',params:[['x0','초기 위치','m',0,-20,20,.5],['v0','초기 속도','m/s',8,-20,20,.5],['a','가속도','m/s²',-1,-10,10,.25],['duration','관찰 시간','s',12,2,30,1]],formula:'x(t) = x₀ + v₀t + ½at²\nv(t) = v₀ + at\na(t) = a',assume:'일정한 가속도, 1차원 운동. (추가 제안 공식)',warning:'위치와 속도의 부호는 오른쪽을 양(+)으로 정의합니다.'},
{id:'vertical',name:'수직 위로 던진 물체',intro:'중력장 안에서 상승·최고점·하강을 계산합니다.',params:[['v0','초기 위쪽 속도','m/s',20,1,60,1],['y0','초기 높이','m',0,0,30,1],['g','중력 가속도','m/s²',9.81,1,20,.01]],formula:'y(t) = y₀ + v₀t − ½gt²\nvᵧ(t) = v₀ − gt\ntₕ = v₀/g',assume:'공기 저항 없음, 위쪽 양(+), 지면 y=0. (추가 제안 공식)',warning:'물체가 지면에 닿으면 운동이 종료됩니다.'},
{id:'projectile',name:'포물선 운동',intro:'발사각·속력 또는 속도 성분을 조절하여 궤적과 속도 벡터를 확인합니다.',params:[['v0','초기 속력','m/s',25,1,80,1],['angle','발사각','°',45,0,90,1],['vx0','초기 수평 속도','m/s',17.678,-60,60,.5],['vy0','초기 수직 속도','m/s',17.678,0,60,.5],['g','중력 가속도','m/s²',9.81,1,20,.01]],formula:'vₓ₀ = v₀ cosθ, vᵧ₀ = v₀ sinθ\nx(t) = vₓ₀t\ny(t) = vᵧ₀t − ½gt²\nvₓ(t) = vₓ₀, vᵧ(t) = vᵧ₀ − gt\nT = 2vᵧ₀/g, H = vᵧ₀²/(2g)\nR = 2vₓ₀vᵧ₀/g',assume:'출발·도착 높이 동일, 공기 저항 없음. T·H·R은 사용자 제공 공식, 성분·시간별 위치식은 추가 제안.',warning:'두 입력 모드는 같은 초기 속도 벡터를 표현합니다. 왼쪽 방향 발사 시 도달 거리는 음수입니다.'},
{id:'collision',name:'충돌과 운동량 보존',intro:'두 물체의 1차원 충돌 전후 운동량과 운동 에너지를 비교합니다.',params:[['m1','물체 A 질량','kg',2,.5,10,.5],['m2','물체 B 질량','kg',3,.5,10,.5],['u1','A 초기 속도','m/s',5,-10,10,.5],['u2','B 초기 속도','m/s',-2,-10,10,.5]],formula:'p = m₁u₁ + m₂u₂\n탄성: v₁ = [(m₁−m₂)u₁+2m₂u₂]/(m₁+m₂)\nv₂ = [2m₁u₁+(m₂−m₁)u₂]/(m₁+m₂)\n완전 비탄성: v = p/(m₁+m₂)',assume:'외부 충격량 무시, 순간 1차원 충돌. (추가 제안 공식)',warning:'충돌은 t=2초에 일어나는 이상화된 사건입니다. 완전 비탄성에서는 두 물체가 붙습니다.'},
{id:'pendulum',name:'진자 운동',intro:'진자의 각도·속력·장력·접선 가속도를 계산합니다.',params:[['length','줄 길이','m',2,.5,5,.1],['angle','초기 각도','°',30,5,80,1],['g','중력 가속도','m/s²',9.81,1,20,.01]],formula:'θ″ = −(g/L)sinθ\naₜ = −g sinθ\nTension = mg cosθ + mv²/L\nm = 1 kg (고정)',assume:'질량 1 kg, 마찰·공기저항 없음. 비선형 단진자 미분방정식을 수치 적분. (추가 제안 공식)',warning:'장력은 줄 방향 힘이며 접선 가속도와 구별합니다. 관성력은 선택한 비관성계에 따라 달라집니다.'},
{id:'elevator',name:'엘리베이터와 등가 원리',intro:'가속도에 따른 겉보기 무게와 관성력을 비교합니다.',params:[['mass','사람 질량','kg',65,20,120,1],['a','엘리베이터 가속도','m/s²',2,-12,12,.5],['g','중력 가속도','m/s²',9.81,1,20,.01],['duration','관찰 시간','s',8,2,20,1]],formula:'N = max(0, m(g+a))\nF관성 = −ma\ng효과 = g+a',assume:'위쪽 양(+), 일정한 가속도, 바닥과 접촉할 때 N=m(g+a). (추가 제안 공식)',warning:'g+a<0이면 바닥과 접촉을 유지할 수 없어 N=0으로 표시합니다. 실제 상대론적 시공간 효과는 계산하지 않습니다.'},
{id:'orbit',name:'케플러 법칙과 궤도',intro:'중심 천체 주변의 원 궤도와 타원 궤도 운동을 비교합니다.',params:[['mass','중심 천체 질량','×10²⁴ kg',5.972,1,30,.1],['radius','시작 거리','×10⁶ m',10,7,35,.5],['factor','원 궤도 대비 초기 속도','배',1,.65,1.3,.01]],formula:'원 궤도: v = √(GM/r)\n중력 가속도: a⃗ = −GM r⃗/|r⃗|³\n타원·비원 궤도: 수치 적분',assume:'중심 천체 고정, 시험입자, 뉴턴 중력, 2차원 속도 Verlet 적분. 원 궤도 공식은 사용자 제공, 궤도 적분은 추가 제안.',warning:'초기 속도가 원 궤도 속도와 다르면 비원형 궤도입니다. 수치 적분 오차가 있을 수 있습니다.'},
{id:'blackhole',name:'블랙홀과 사건의 지평선',intro:'질량과 거리에 따른 탈출 속도·중력 위치 에너지·슈바르츠실트 반지름을 살펴봅니다.',params:[['mass','중심 천체 질량','태양 질량',5,1,50,1],['radius','관찰 거리','km',50,5,500,5]],formula:'U/m = −GM/r\nv탈출 = √(2GM/r)\nrₛ = 2GM/c²\nE/m = ½v² − GM/r',assume:'슈바르츠실트 반지름은 비회전·무전하 블랙홀의 일반상대론적 결과. 외부 탈출 속도와 에너지는 뉴턴 근사.',warning:'사건의 지평선 내부에서 뉴턴 탈출 속도는 물리적 해석에 사용할 수 없습니다. 그림은 개념도이며 시공간 곡률 계산이 아닙니다.'}
];
let active=0,values={},mode='polar',collisionType='elastic',t=0,playing=false,last=0,orbitCache=null,pendCache=null;
const $=id=>document.getElementById(id),fmt=(x,n=2)=>Number.isFinite(x)?Number(x).toLocaleString('ko-KR',{maximumFractionDigits:n}):'—';
function setup(){const m=modules[active];values=Object.fromEntries(m.params.map(p=>[p[0],p[3]]));t=0;playing=false;orbitCache=null;pendCache=null;$('play').textContent='▶ 재생';$('title').textContent=m.name;$('intro').textContent=m.intro;$('formula').textContent=m.formula;$('assumptions').textContent=m.assume;$('warning').textContent=m.warning;$('category').textContent=['orbit','blackhole'].includes(m.id)?'중력과 우주':'역학';$('modeWrap').innerHTML=m.id==='projectile'?'<label class="muted">입력 방식 <select id="inputMode"><option value="polar">속력·발사각</option><option value="components">수평·수직 속도</option></select></label>':m.id==='collision'?'<label class="muted">충돌 유형 <select id="collisionType"><option value="elastic">완전 탄성</option><option value="inelastic">완전 비탄성</option></select></label>':'';if(m.id==='projectile'){$('inputMode').value=mode;$('inputMode').onchange=e=>{mode=e.target.value;syncProjectile();renderFields();update()}}if(m.id==='collision'){$('collisionType').value=collisionType;$('collisionType').onchange=e=>{collisionType=e.target.value;update()}}renderFields();update()}
function syncProjectile(){if(mode==='polar'){values.v0=Math.hypot(values.vx0,values.vy0);values.angle=Math.atan2(values.vy0,values.vx0)*180/Math.PI}else{values.vx0=values.v0*Math.cos(values.angle*Math.PI/180);values.vy0=values.v0*Math.sin(values.angle*Math.PI/180)}}
function renderFields(){const m=modules[active];$('fields').innerHTML='';m.params.forEach(p=>{if(m.id==='projectile'&&((mode==='polar'&&['vx0','vy0'].includes(p[0]))||(mode==='components'&&['v0','angle'].includes(p[0]))))return;const div=document.createElement('div');div.className='field';div.innerHTML=`<label for="f_${p[0]}">${p[1]} (${p[2]}) <span class="value" id="v_${p[0]}">${fmt(values[p[0]],3)}</span></label><input id="f_${p[0]}" type="range" min="${p[4]}" max="${p[5]}" step="${p[6]}" value="${values[p[0]]}">`;$('fields').append(div);div.querySelector('input').oninput=e=>{values[p[0]]=+e.target.value;div.querySelector('.value').textContent=fmt(values[p[0]],3);if(m.id==='projectile')syncProjectile();orbitCache=null;pendCache=null;t=0;update()}})}
function endTime(){const v=values,id=modules[active].id;if(id==='linear'||id==='elevator')return v.duration;if(id==='vertical')return (v.v0+Math.sqrt(v.v0*v.v0+2*v.g*v.y0))/v.g;if(id==='projectile')return Math.max(.01,2*v.vy0/v.g);if(id==='collision')return 6;if(id==='pendulum')return 12;if(id==='orbit'){const mu=G*v.mass*1e24,r=v.radius*1e6;return Math.min(60000,Math.max(1000,TAU*Math.sqrt(r*r*r/mu)*1.6))}return 10}
function pendulumAt(time){const v=values,dt=.008,L=v.length,grav=v.g,steps=Math.ceil(12/dt);if(!pendCache){let a=v.angle*Math.PI/180,w=0;pendCache=[{a,w}];for(let i=1;i<=steps;i++){let acc=-grav/L*Math.sin(a),half=w+acc*dt/2,next=a+half*dt;w=half-grav/L*Math.sin(next)*dt/2;a=next;pendCache.push({a,w})}}let index=Math.min(pendCache.length-1,Math.floor(time/dt)),p=pendCache[index];return{a:p.a,w:p.w,x:L*Math.sin(p.a),y:-L*Math.cos(p.a),at:-grav*Math.sin(p.a),tension:grav*Math.cos(p.a)+L*p.w*p.w}}
function orbitAt(time){const v=values,mu=G*v.mass*1e24,r=v.radius*1e6,v0=Math.sqrt(mu/r)*v.factor,T=endTime(),dt=T/2500;if(!orbitCache){let x=r,y=0,vx=0,vy=v0;orbitCache=[{x,y,vx,vy}];for(let i=1;i<=2500;i++){let d=Math.hypot(x,y),ax=-mu*x/d**3,ay=-mu*y/d**3,nx=x+vx*dt+.5*ax*dt*dt,ny=y+vy*dt+.5*ay*dt*dt,nd=Math.hypot(nx,ny),nax=-mu*nx/nd**3,nay=-mu*ny/nd**3;vx+=(ax+nax)*dt/2;vy+=(ay+nay)*dt/2;x=nx;y=ny;orbitCache.push({x,y,vx,vy})}}return orbitCache[Math.min(2500,Math.floor(time/dt))]}
function state(time){const v=values,id=modules[active].id;if(id==='linear')return{x:v.x0+v.v0*time+.5*v.a*time*time,vel:v.v0+v.a*time,a:v.a};if(id==='vertical')return{x:0,y:Math.max(0,v.y0+v.v0*time-.5*v.g*time*time),vy:v.v0-v.g*time,peak:v.y0+v.v0*v.v0/(2*v.g)};if(id==='projectile'){let vx=v.vx0,vy=v.vy0-v.g*time;return{x:vx*time,y:Math.max(0,v.vy0*time-.5*v.g*time*time),vx,vy,speed:Math.hypot(vx,vy),peak:v.vy0*v.vy0/(2*v.g),range:2*v.vx0*v.vy0/v.g}}if(id==='collision'){const m1=v.m1,m2=v.m2,p=m1*v.u1+m2*v.u2;let a=collisionType==='elastic'?((m1-m2)*v.u1+2*m2*v.u2)/(m1+m2):p/(m1+m2),b=collisionType==='elastic'?(2*m1*v.u1+(m2-m1)*v.u2)/(m1+m2):a,after=time>=2;return{x1:after?v.u1*2+a*(time-2):v.u1*time,x2:after?v.u2*2+b*(time-2):v.u2*time,v1:after?a:v.u1,v2:after?b:v.u2,p,ke:.5*m1*(after?a:v.u1)**2+.5*m2*(after?b:v.u2)**2}}if(id==='pendulum')return pendulumAt(time);if(id==='elevator')return{y:.5*v.a*time*time,vel:v.a*time,N:Math.max(0,v.mass*(v.g+v.a)),inertial:-v.mass*v.a};if(id==='orbit'){let s=orbitAt(time);return{...s,r:Math.hypot(s.x,s.y),speed:Math.hypot(s.vx,s.vy),circular:Math.sqrt(G*v.mass*1e24/(v.radius*1e6))}}const M=v.mass*1.98847e30,r=v.radius*1000,rs=2*G*M/C**2;return{rs,esc:Math.sqrt(2*G*M/r),energy:-G*M/r,r}}
function statData(s){const v=values,id=modules[active].id;if(id==='linear')return[['위치',fmt(s.x)+' m'],['속도',fmt(s.vel)+' m/s'],['가속도',fmt(s.a)+' m/s²']];if(id==='vertical')return[['높이',fmt(s.y)+' m'],['수직 속도',fmt(s.vy)+' m/s'],['최고 높이',fmt(s.peak)+' m']];if(id==='projectile')return[['수평 위치',fmt(s.x)+' m'],['수직 위치',fmt(s.y)+' m'],['수평 속도',fmt(s.vx)+' m/s'],['수직 속도',fmt(s.vy)+' m/s'],['전체 속력',fmt(s.speed)+' m/s'],['도달 거리',fmt(s.range)+' m'],['최고 높이',fmt(s.peak)+' m'],['최고점 시간',fmt(v.vy0/v.g)+' s'],['발사각',fmt(values.angle)+' °']];if(id==='collision')return[['A 속도',fmt(s.v1)+' m/s'],['B 속도',fmt(s.v2)+' m/s'],['총 운동량',fmt(s.p)+' kg·m/s'],['운동 에너지',fmt(s.ke)+' J']];if(id==='pendulum')return[['진자각',fmt(s.a*180/Math.PI)+' °'],['속력',fmt(Math.abs(s.w*v.length))+' m/s'],['접선 가속도',fmt(s.at)+' m/s²'],['줄 장력',fmt(s.tension)+' N']];if(id==='elevator')return[['겉보기 무게',fmt(s.N)+' N'],['관성력',fmt(s.inertial)+' N'],['속도',fmt(s.vel)+' m/s'],['유효 중력',fmt(v.g+v.a)+' m/s²']];if(id==='orbit')return[['중심 거리',fmt(s.r/1e6)+' ×10⁶m'],['속력',fmt(s.speed/1000)+' km/s'],['원 궤도 속력',fmt(s.circular/1000)+' km/s']];return[['슈바르츠실트 반지름',fmt(s.rs/1000)+' km'],['탈출 속도',fmt(s.esc/1000)+' km/s'],['빛의 속도 비',fmt(s.esc/C,3)+' c'],['위치 에너지/질량',fmt(s.energy/1e12)+' TJ/kg']]}
function canvasCtx(id){let c=$(id),r=c.getBoundingClientRect(),d=window.devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);let ctx=c.getContext('2d');ctx.scale(d,d);return{ctx,w:r.width,h:r.height}}
function scene(){const {ctx:c,w,h}=canvasCtx('scene'),id=modules[active].id,s=state(t),T=endTime();c.clearRect(0,0,w,h);c.strokeStyle='#23334e';c.lineWidth=1;for(let i=0;i<11;i++){let x=w*i/10;c.beginPath();c.moveTo(x,0);c.lineTo(x,h);c.stroke()}for(let i=0;i<8;i++){let y=h*i/7;c.beginPath();c.moveTo(0,y);c.lineTo(w,y);c.stroke()}const ball=(x,y,r=11,color='#67c9ff')=>{c.fillStyle=color;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()},line=(x1,y1,x2,y2,color='#6fa7d8',width=2)=>{c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()},label=(str,x,y)=>{c.fillStyle='#d7e5ff';c.font='12px system-ui';c.fillText(str,x,y)};
if(id==='linear'||id==='collision'||id==='elevator'){const cy=h*.57;line(25,cy+22,w-25,cy+22);if(id==='linear'){let samples=Array.from({length:101},(_,i)=>state(T*i/100).x),lo=Math.min(...samples),hi=Math.max(...samples),scale=(w-90)/(hi-lo||1),px=45+(s.x-lo)*scale;ball(px,cy,14);label('x = '+fmt(s.x)+' m',Math.min(w-130,Math.max(20,px-40)),cy-28)}else if(id==='collision'){let span=70,px=w/2+Math.tanh(s.x1/18)*span*2,qx=w/2+Math.tanh(s.x2/18)*span*2;ball(px,cy,12+values.m1,'#68d1fa');ball(qx,cy,12+values.m2,'#ffb16b');label('A',px-4,cy-30);label('B',qx-4,cy+40)}else{let yy=cy-Math.tanh(s.y/100)*100;c.fillStyle='#334c6c';c.fillRect(w/2-60,yy-65,120,130);ball(w/2,yy+30,14);line(w/2-40,yy+48,w/2+40,yy+48);label('N = '+fmt(s.N)+' N',w/2-48,yy-35)}}
else if(id==='vertical'||id==='projectile'){const trajectory=Array.from({length:121},(_,i)=>state(T*i/120)),xs=trajectory.map(q=>q.x||0),maxX=Math.max(...xs,0),minX=Math.min(...xs,0),maxY=Math.max(...trajectory.map(q=>q.y),1),mapX=x=>35+(x-minX)/(maxX-minX||1)*(w-70),mapY=y=>h-38-y/maxY*(h-80);line(20,h-38,w-20,h-38);c.beginPath();trajectory.forEach((p,i)=>i?c.lineTo(mapX(p.x||0),mapY(p.y)):c.moveTo(mapX(p.x||0),mapY(p.y)));c.strokeStyle='#4d87b8';c.setLineDash([5,5]);c.stroke();c.setLineDash([]);let px=mapX(s.x||0),py=mapY(s.y);ball(px,py);if(id==='projectile'){line(px,py,px+s.vx*2,py-s.vy*2,'#ffba66',3);label('v⃗',Math.min(w-25,px+15),Math.max(20,py-15))}label('y='+fmt(s.y)+'m',Math.min(w-95,px+12),Math.max(20,py-15))}
else if(id==='pendulum'){let cx=w/2,cy=45,L=Math.min(h*.62,w*.36),px=cx+Math.sin(s.a)*L,py=cy+Math.cos(s.a)*L;line(cx,cy,px,py,'#b5c9e5',3);ball(cx,cy,5,'#ffffff');ball(px,py,17);label('θ = '+fmt(s.a*180/Math.PI)+'°',20,25)}
else if(id==='orbit'){let cx=w/2,cy=h/2,maxR=Math.max(values.radius*1e6*2,...(orbitCache||[]).filter((_,i)=>i%30===0).map(p=>Math.hypot(p.x,p.y))),scale=Math.min(w,h)*.42/maxR;ball(cx,cy,16,'#ffcb67');c.beginPath();(orbitCache||[]).forEach((p,i)=>{let x=cx+p.x*scale,y=cy-p.y*scale;i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle='#4c86b4';c.stroke();ball(cx+s.x*scale,cy-s.y*scale,9);label('중심 천체',cx-30,cy+33)}
else{let cx=w/2,cy=h/2,outer=Math.min(w,h)*.35,rs=s.rs/1000,ratio=rs/values.radius;ball(cx,cy,Math.max(12,Math.min(outer,outer*ratio)),'#05070c');c.beginPath();c.arc(cx,cy,Math.min(outer,Math.max(12,outer*ratio)),0,TAU);c.strokeStyle='#f5ae63';c.lineWidth=3;c.stroke();c.beginPath();c.arc(cx,cy,outer,0,TAU);c.setLineDash([5,5]);c.strokeStyle='#78cfff';c.stroke();c.setLineDash([]);label('사건의 지평선',cx-48,cy-Math.max(20,Math.min(outer,outer*ratio))-12);label('관찰 거리 r',cx+outer-75,cy+24)} }
function graph(){const {ctx:c,w,h}=canvasCtx('graph'),id=modules[active].id,T=endTime(),N=110;const series=[];let names=[];if(id==='linear'){names=['위치 (m)','속도 (m/s)'];series.push(q=>q.x,q=>q.vel)}else if(id==='vertical'){names=['높이 (m)','수직 속도 (m/s)'];series.push(q=>q.y,q=>q.vy)}else if(id==='projectile'){names=['수평 속도 (m/s)','수직 속도 (m/s)'];series.push(q=>q.vx,q=>q.vy)}else if(id==='collision'){names=['A 속도 (m/s)','B 속도 (m/s)'];series.push(q=>q.v1,q=>q.v2)}else if(id==='pendulum'){names=['각도 (°)','접선 가속도 (m/s²)'];series.push(q=>q.a*180/Math.PI,q=>q.at)}else if(id==='elevator'){names=['속도 (m/s)','겉보기 무게 (N)'];series.push(q=>q.vel,q=>q.N)}else if(id==='orbit'){names=['거리 (×10⁶m)','속력 (km/s)'];series.push(q=>q.r/1e6,q=>q.speed/1000)}else{names=['탈출 속도 (km/s)','사건의 지평선 (km)'];series.push(q=>q.esc/1000,q=>q.rs/1000)}const samples=Array.from({length:N+1},(_,i)=>state(T*i/N));c.fillStyle='#a7b8d2';c.font='11px system-ui';c.fillText('0',14,h-10);c.fillText(fmt(T,1)+' s',w-53,h-10);const colors=['#69d5ff','#ffb26e'];series.forEach((fn,j)=>{let data=samples.map(fn),min=Math.min(...data),max=Math.max(...data),pad=(max-min)*.1||1;min-=pad;max+=pad;c.beginPath();data.forEach((v,i)=>{let x=35+(w-55)*i/N,y=22+(h-55)*(1-(v-min)/(max-min));i?c.lineTo(x,y):c.moveTo(x,y)});c.strokeStyle=colors[j];c.lineWidth=2;c.stroke();c.fillStyle=colors[j];c.fillText(names[j],42+j*(w-55)/2,13)});let x=35+(w-55)*t/T;c.beginPath();c.moveTo(x,20);c.lineTo(x,h-30);c.strokeStyle='#ffffff';c.setLineDash([4,4]);c.stroke();c.setLineDash([])}
function update(){let T=endTime();t=Math.min(Math.max(t,0),T);$('time').max=T;$('time').value=t;$('clock').textContent=fmt(t,2)+' s';$('stats').innerHTML=statData(state(t)).map(([k,v])=>`<div class="stat"><span>${k}</span><strong>${v}</strong></div>`).join('');scene();graph()}
$('nav').innerHTML=modules.map((m,i)=>`<button data-i="${i}">${i+1}. ${m.name}</button>`).join('');$('nav').onclick=e=>{let b=e.target.closest('button');if(!b)return;active=+b.dataset.i;document.querySelectorAll('nav button').forEach((x,i)=>x.classList.toggle('active',i===active));setup()};$('play').onclick=()=>{if(t>=endTime())t=0;playing=!playing;$('play').textContent=playing?'Ⅱ 일시정지':'▶ 재생'};$('reset').onclick=()=>{t=0;playing=false;$('play').textContent='▶ 재생';update()};$('time').oninput=e=>{t=+e.target.value;update()};window.addEventListener('resize',update);function tick(ts){if(last&&playing){t+=(ts-last)/1000*Number($('speed').value);if(t>=endTime()){t=endTime();playing=false;$('play').textContent='▶ 재생'}update()}last=ts;requestAnimationFrame(tick)}document.querySelector('nav button').classList.add('active');setup();requestAnimationFrame(tick);
</script></body></html>
